[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = ">=0.12.8"

[project]
name = "safe-mol"
description = "Implementation of the 'Gotta be SAFE: a new framework for molecular design' paper"
dynamic = ["version"]
authors = [{ name = "Emmanuel Noutahi", email = "emmanuel.noutahi@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

keywords = ["safe", "smiles", "de novo", "design", "molecules"]
dependencies = [
    "datamol>=0.12.5",
    "loguru>=0.7",
    "networkx>=3.2",
    "numpy>=1.26",
    "rdkit>=2024.9.1,!=2026.3.*",
]

[project.optional-dependencies]
model = [
    "fsspec>=2023.9.2",
    "tokenizers>=0.22,<0.23",
    "torch>=2.5",
    "tqdm>=4.66",
    "transformers>=4.57,<5",
]
train = [
    "accelerate>=1.1",
    "datasets>=4",
    "evaluate>=0.4.3",
    "fsspec>=2023.9.2",
    "tokenizers>=0.22,<0.23",
    "torch>=2.5",
    "tqdm>=4.66",
    "transformers>=4.57,<5",
    "universal-pathlib>=0.2",
]
viz = ["matplotlib>=3.8", "pillow>=10"]
wandb = ["fsspec>=2023.9.2", "wandb>=0.18"]
all = [
    "accelerate>=1.1",
    "datasets>=4",
    "evaluate>=0.4.3",
    "fsspec>=2023.9.2",
    "matplotlib>=3.8",
    "pillow>=10",
    "tokenizers>=0.22,<0.23",
    "torch>=2.5",
    "tqdm>=4.66",
    "transformers>=4.57,<5",
    "universal-pathlib>=0.2",
    "wandb>=0.18",
]
test = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8",
    "pytest-cov>=6",
]
docs = [
    "markdown-include>=0.8.1",
    "mdx-truly-sane-lists>=1.3",
    "mike>=2",
    "mkdocs>=1.6",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.5",
    "mkdocs-material-extensions>=1.3",
    "mkdocstrings[python]>=0.30",
]
dev = [
    "black[jupyter]>=25",
    "build>=1.2",
    "pre-commit>=4",
    "ruff>=0.11",
    "twine>=6",
]

[project.urls]
"Source Code" = "https://github.com/datamol-io/safe"
"Bug Tracker" = "https://github.com/datamol-io/safe/issues"
Documentation = "https://safe-docs.datamol.io/"


[project.scripts]
safe-train = "safe.trainer.cli:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools_scm]
fallback_version = "dev"

[tool.setuptools.packages.find]
where = ["."]
include = ["safe", "safe.*"]
exclude = []
namespaces = true

[tool.setuptools.package-data]
"safe.trainer.configs" = ["*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--verbose --color=yes --durations=10 --cov=safe --cov-report=xml:cov.xml --cov-report=term"
testpaths = ["tests"]
markers = [
    "integration: accesses the published SAFE-GPT model and executes maintained tutorials",
    "notebook: executes a tutorial notebook",
]
filterwarnings = ["ignore::DeprecationWarning:jupyter_client"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.coverage.run]
source = ["safe"]
omit = ["safe/_version.py"]

[tool.coverage.xml]
output = "cov.xml"
